        title: Discriminant Validity (HTMT)
        type: Table
        rows: 0
        refs:
          - henseler_2015
          - roemer_2021
        clearWith:
          - reflective
          - formative
          - reflectiveHoc
          - formativeHoc
          - hocApproach
          - structural
          - estimator
          - innerScheme
          - weightApproach
          - indicatorScale
          - missing
          - bootstrap
          - bootReps
          - resampleMethod
          - bootSeed
          - ciLevel
