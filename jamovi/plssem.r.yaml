---
name: plssem
title: PLS-SEM
jrs: '1.1'

items:
  - name: intro
    title: PLS-SEM
    type: Html

  - name: keySummary
    title: Key Findings
    type: Html
    visible: (showKeySummary)

  # Progress while resampling; hidden once the bootstrap is done, when the
  # record is in bootSummary (the elapsed time is a footnote there).
  # ES: Avance durante el remuestreo; se oculta al terminar, cuando el registro
  # está en bootSummary (el tiempo transcurrido es una nota de esa tabla).
  - name: bootStatus
    title: Bootstrap
    type: Html
    visible: (bootstrap)

  # The same record as numbers (jamovi's audit of EGAnetLab: numeric summary
  # tables, not numbers inside text).
  # ES: El mismo registro en números (tablas de resumen numéricas).
  - name: bootSummary
    title: Bootstrap Resamples
    type: Table
    rows: 1
    visible: (bootstrap)
    refs:
      - efron_1993
    clearWith:
      - reflective
      - formative
      - reflectiveHoc
      - formativeHoc
      - hocApproach
      - structural
      - estimator
      - innerScheme
      - weightApproach
      - indicatorScale
      - missing
      - bootReps
      - resampleMethod
      - bootSeed
      - ciLevel
    columns:
      - name: requested
        title: Requested
        type: integer
      - name: drawn
        title: Drawn
        type: integer
      - name: admissible
        title: Admissible
        type: integer
      - name: seed
        title: Seed
        type: integer
      - name: block
        title: Block Size
        type: integer
      - name: level
        title: Confidence Level
        type: number
        format: pc

  - name: choicesGuide
    title: About Your Choices
    type: Html
    visible: (showChoicesGuide)

  # Section: Measurement model. Groups give the report headings that tell the reader
  # where each part starts.
  # ES: Sección con título: da al informe encabezados que ubican al lector.
  - name: measurementSection
    title: Measurement Model
    type: Group
    items:
      - name: modelGuide
        title: How to Read the Model Summary
        type: Html
        visible: (showGuides)

      # One row per construct defined in the boxes (rows laid out in .init()).
      # ES: Una fila por constructo definido en las cajas (filas en .init()).
      - name: model
        title: Model Summary
        type: Table
        rows: 0
        refs:
          - csem_pkg
          - hair_2021
        clearWith:
          - reflective
          - formative
          - reflectiveHoc
          - formativeHoc
          - hocApproach
          - structural
          - estimator
          - innerScheme
          - weightApproach
          - indicatorScale
          - missing
        columns:
          - name: construct
            title: Construct
            type: text
          - name: measurement
            title: Measurement Model
            type: text
          - name: indicators
            title: Indicators
            type: integer
          - name: role
            title: Role
            type: text
          - name: predictors
            title: Predicted by
            type: text

      - name: measurementGuide
        title: How to Read Loadings and Weights
        type: Html
        visible: (showGuides)

      # One row per indicator (rows laid out in .init()).
      # ES: Una fila por indicador (filas en .init()).
      - name: measurement
        title: Loadings and Weights
        type: Table
        rows: 0
        refs:
          - hwang_2004
          - kettenring_1971
          - tenenhaus_2005
          - hair_2019
        clearWith:
          - reflective
          - formative
          - reflectiveHoc
          - formativeHoc
          - hocApproach
          - structural
          - estimator
          - innerScheme
          - weightApproach
          - indicatorScale
          - missing
          - bootstrap
          - bootReps
          - resampleMethod
          - bootSeed
          - ciLevel
        columns:
          - name: construct
            title: Construct
            type: text
            combineBelow: true
          - name: indicator
            title: Indicator
            type: text
          - name: loading
            title: Loading
            type: number
          - name: loadLower
            title: Lower
            type: number
            superTitle: Loading CI
            visible: (bootstrap)
          - name: loadUpper
            title: Upper
            type: number
            superTitle: Loading CI
            visible: (bootstrap)
          - name: weight
            title: Weight
            type: number

          - name: weightLower
            title: Lower
            type: number
            superTitle: Weight CI
            visible: (bootstrap)
          - name: weightUpper
            title: Upper
            type: number
            superTitle: Weight CI
            visible: (bootstrap)
          - name: weightP
            title: p (Weight)
            type: number
            format: zto,pvalue
            visible: (bootstrap)

      - name: reliabilityGuide
        title: How to Read Reliability and Convergent Validity
        type: Html
        visible: (showGuides)

