            visible: (bootstrap)
          - name: rhoCUpper
            title: Upper
            type: number
            superTitle: ρC CI
            visible: (bootstrap)
          - name: omega
            title: ω (CFA)
            type: number
            visible: (omegaCfa)
          - name: ave
            title: AVE
            type: number
          - name: aveLower
            title: Lower
            type: number
            superTitle: AVE CI
            visible: (bootstrap)
          - name: aveUpper
            title: Upper
            type: number
            superTitle: AVE CI
            visible: (bootstrap)
          - name: assessment
            title: Assessment
            type: text

