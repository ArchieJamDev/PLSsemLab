# Builds the PLSsemLab .jmo for jamovi on Linux (the flatpak from Flathub),
# compiling cSEM and its dependencies with jamovi's own R, so the module can
# be tested without R or jmvtools on the user's computer. The .jmo is
# attached to the "dev-build" pre-release and kept as a workflow artifact.
# Install it in jamovi with ⋮ › Modules › Install from file (sideload).
# ES: Construye el .jmo de PLSsemLab para jamovi en Linux (el flatpak de
# Flathub), compilando cSEM y sus dependencias con el R del propio jamovi,
# para probar el módulo sin R ni jmvtools en el computador del usuario. El
# .jmo se adjunta a la pre-release "dev-build" y queda como artefacto.
# Se instala en jamovi con ⋮ › Módulos › Instalar desde archivo.
name: Build .jmo (Linux)

on:
  workflow_dispatch:
    inputs:
      jamovi_commit:
        description: 'Flatpak commit of org.jamovi.jamovi to build for (flatpak info shows it); empty = latest'
        required: false
        default: ''
      jamovi_series:
        description: 'Build for the newest jamovi of this series still on Flathub (e.g. 2.7); empty = latest'
        required: false
        default: ''
      r_version:
        description: "Build with this R version instead of a flatpak jamovi (jamovi 2.7.x uses 4.5.0); empty = use the flatpak"
        required: false
        default: ''
      app_version:
        description: 'jamovi version to declare when r_version is used (e.g. 2.7.27)'
        required: false
        default: '2.7.27'
      tag:
        description: 'Pre-release tag to attach the .jmo to'
        required: false
        default: 'dev-build'
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.r_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # jamovi from Flathub, plus the SDK of its runtime: the compiler runs
      # jamovi's R with `flatpak run --devel`, which needs the SDK compilers
      # (cSEM's dependencies TruncatedNormal, spacefillr and qrng are C++).
      # ES: jamovi desde Flathub y el SDK de su runtime: el compilador corre
      # el R de jamovi con `flatpak run --devel`, que necesita los
      # compiladores del SDK.
      - name: Install jamovi (flatpak) and its SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.jamovi.jamovi
          # A .jmo only loads in a jamovi with the same R version, so it can be
          # built for the exact jamovi the user has.
          # ES: Un .jmo solo carga en un jamovi con la misma versión de R, así
          # que se puede construir para el jamovi exacto del usuario.
          COMMIT="${{ inputs.jamovi_commit }}"
          SERIES="${{ inputs.jamovi_series }}"
          if [ -z "$COMMIT" ] && [ -n "$SERIES" ]; then
            for c in $(flatpak remote-info --log flathub org.jamovi.jamovi | awk '/Commit:/ {print $2}'); do
              v=$(flatpak remote-info --commit="$c" flathub org.jamovi.jamovi 2>/dev/null | awk '/Version:/ {print $2}')
              echo "commit $c -> version $v"
              case "$v" in "$SERIES".*) COMMIT="$c"; break ;; esac
            done
          fi
          if [ -n "$COMMIT" ]; then
            sudo flatpak update -y --noninteractive --commit="$COMMIT" org.jamovi.jamovi
          fi
          RUNTIME=$(flatpak info --show-runtime org.jamovi.jamovi)
          SDK=${RUNTIME/Platform/Sdk}
          echo "jamovi runtime: $RUNTIME -> SDK: $SDK"
          sudo flatpak install -y --noninteractive flathub "$SDK"
          flatpak info org.jamovi.jamovi | head -20

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get the jamovi compiler
        run: |
          git clone --depth 1 https://github.com/jamovi/jamovi-compiler.git "$RUNNER_TEMP/jmc"
          cd "$RUNNER_TEMP/jmc" && npm install --omit=dev
          # The compiler keys its CRAN snapshots by exact R version; when the
          # flatpak's R is a patch release it does not list, fall back to the
          # snapshot of the same minor version (or the newest one).
          # ES: El compilador busca la instantánea de CRAN por la versión
          # exacta de R; si el R del flatpak es un parche que no lista, usa
          # la de la misma versión menor (o la más reciente).
          flatpak run --devel org.jamovi.jamovi -R --version | head -3 || true
          sed -i "s|let snapshot = snapshots\[rVersion\];|let snapshot = snapshots[rVersion] \|\| snapshots[Object.keys(snapshots).filter(k => k.slice(0, 3) === rVersion.slice(0, 3)).pop()] \|\| snapshots[Object.keys(snapshots).pop()];|" compilerr.js
          grep -n "let snapshot =" compilerr.js

      - name: Build the .jmo with jamovi's R
        run: |
          VERSION=$(flatpak info org.jamovi.jamovi | awk '/Version:/ {print $2}')
          echo "jamovi version: $VERSION"
          node "$RUNNER_TEMP/jmc/index.js" --build . --home flatpak --assume-app-version "$VERSION"
          ls -la *.jmo

      - name: Keep the .jmo as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLSsemLab-linux-jmo
          path: '*.jmo'

      - name: Attach the .jmo to the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG:-dev-build}"
          JV=$(flatpak info org.jamovi.jamovi | awk '/Version:/ {print $2}')
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" *.jmo --prerelease --target "$GITHUB_SHA" \
            --title "Development build (Linux, jamovi flatpak $JV)" \
            --notes "Built from ${GITHUB_SHA::7} for testing. Install in jamovi: ⋮ › Modules › Install from file. Not a release: the module is in development."

  # Older jamovi releases are no longer served by Flathub, but the compiler
  # keeps a CRAN snapshot per R version with binaries built for jamovi
  # (repo.jamovi.org/cran-linux). This job builds with that R version and a
  # stand-in jamovi home, so the .jmo declares the R version of the user's
  # jamovi (jamovi 2.7.x: R 4.5.0-x64).
  # ES: Flathub ya no sirve versiones viejas de jamovi, pero el compilador
  # guarda una instantánea de CRAN por versión de R con binarios hechos para
  # jamovi. Este trabajo compila con esa versión de R y un jamovi sustituto,
  # así el .jmo declara la versión de R del jamovi del usuario.
  build-linux-r:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # R from the rocker image of that version, with no apt: setup-r needs
      # the Ubuntu archives, which stopped resolving from the runners.
      # ES: R desde la imagen rocker de esa versión, sin apt: setup-r
      # necesita los archivos de Ubuntu, que dejaron de resolver.
      - name: Build the .jmo in R ${{ inputs.r_version }}
        run: |
          mkdir -p .tools/node .tools/jmc
          curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz | tar -xJ -C .tools/node --strip-components=1
          curl -fsSL https://codeload.github.com/jamovi/jamovi-compiler/tar.gz/refs/heads/main | tar -xz -C .tools/jmc --strip-components=1
          (cd .tools/jmc && PATH="$PWD/../node/bin:$PATH" npm install --omit=dev --silent)
          docker run --rm -v "$PWD:/w" -w /w -e APP_VERSION="${{ inputs.app_version }}" \
            rocker/r-ver:${{ inputs.r_version }} bash .github/scripts/build-jmo-r.sh
          ls -la *.jmo

      - name: Keep the .jmo as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLSsemLab-linux-R${{ inputs.r_version }}-jmo
          path: '*.jmo'

      - name: Attach the .jmo to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG:-dev-build}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" *.jmo --prerelease --target "$GITHUB_SHA" \
            --title "Development build (Linux, jamovi ${{ inputs.app_version }}, R ${{ inputs.r_version }})" \
            --notes "Built from ${GITHUB_SHA::7} for testing. Install in jamovi: ⋮ › Modules › Install from file. Not a release: the module is in development."
