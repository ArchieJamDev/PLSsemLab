# Runs the design experiments on GitHub's machines, so no local R is needed.
# Start it from the Actions tab ("Run workflow"), optionally with a list of
# experiments (e.g. "E1 E5"). Results are attached to the run as an artifact.
# ES: Ejecuta los experimentos de diseño en las máquinas de GitHub, sin R local.
# ES: Se lanza desde la pestaña Actions ("Run workflow"), opcionalmente con una
# lista de experimentos (p. ej. "E1 E5"). Los resultados quedan como artefacto.
name: design-experiments

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Experiments to run (blank = all), e.g. E1 E5"
        required: false
        default: ""
  push:
    paths:
      - "experiments/design-v1/**"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/design-v1
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::cSEM
      - name: Run experiments
        run: Rscript run_all.R ${{ github.event.inputs.experiments }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-experiments-results
          path: experiments/design-v1/results/
