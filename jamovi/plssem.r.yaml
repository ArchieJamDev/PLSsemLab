---
name: plssem
title: PLS-SEM
jrs: '1.1'

items:
  - name: intro
    title: PLS-SEM
    type: Html

  - name: keySummary
    title: Key findings
    type: Html
    visible: (showKeySummary)

  # Progress while resampling, then a record of what was done (resamples,
  # admissible ones, seed, time).
  # ES: Avance durante el remuestreo y luego el registro de lo hecho.
  - name: bootStatus
    title: Bootstrap
    type: Html
    visible: (bootstrap)

  - name: choicesGuide
    title: About your choices
    type: Html
    visible: (showChoicesGuide)

  - name: modelGuide
    title: How to read the model summary
    type: Html
    visible: (showGuides)

  # One row per construct defined in the boxes (rows laid out in .init()).
  # ES: Una fila por constructo definido en las cajas (filas en .init()).
  - name: model
    title: Model summary
    type: Table
    rows: 0
    refs:
      - csem_pkg
      - hair_2021
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
    columns:
      - name: construct
        title: Construct
        type: text
      - name: measurement
        title: Measurement model
        type: text
      - name: indicators
        title: Indicators
        type: integer
      - name: role
        title: Role
        type: text
      - name: predictors
        title: Predicted by
        type: text

  - name: measurementGuide
    title: How to read loadings and weights
    type: Html
    visible: (showGuides)

  # One row per indicator (rows laid out in .init()).
  # ES: Una fila por indicador (filas en .init()).
  - name: measurement
    title: Loadings and weights
    type: Table
    rows: 0
    refs:
      - tenenhaus_2005
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: construct
        title: Construct
        type: text
        combineBelow: true
      - name: indicator
        title: Indicator
        type: text
      - name: loading
        title: Loading
        type: number
      - name: loadLower
        title: Lower
        type: number
        superTitle: Loading CI
        visible: (bootstrap)
      - name: loadUpper
        title: Upper
        type: number
        superTitle: Loading CI
        visible: (bootstrap)
      - name: weight
        title: Weight
        type: number

      - name: weightLower
        title: Lower
        type: number
        superTitle: Weight CI
        visible: (bootstrap)
      - name: weightUpper
        title: Upper
        type: number
        superTitle: Weight CI
        visible: (bootstrap)
      - name: weightP
        title: p (weight)
        type: number
        format: zto,pvalue
        visible: (bootstrap)
  - name: reliabilityGuide
    title: How to read reliability and convergent validity
    type: Html
    visible: (showGuides)

  # One row per reflective construct (rows laid out in .init()).
  # ES: Una fila por constructo reflectivo (filas en .init()).
  - name: reliability
    title: Reliability and convergent validity
    type: Table
    rows: 0
    refs:
      - hair_2019
      - dijkstra_2015
      - mcdonald_1999
      - schuberth_2018
      - chalmers_2018
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
      - omegaCfa
    columns:
      - name: construct
        title: Construct
        type: text
      - name: alpha
        title: Cronbach's α
        type: number
      - name: rhoA
        title: ρA
        type: number
      - name: rhoC
        title: ρC
        type: number
      - name: rhoCLower
        title: Lower
        type: number
        superTitle: ρC CI
        visible: (bootstrap)
      - name: rhoCUpper
        title: Upper
        type: number
        superTitle: ρC CI
        visible: (bootstrap)
      - name: omega
        title: ω (CFA)
        type: number
        visible: (omegaCfa)
      - name: ave
        title: AVE
        type: number
      - name: aveLower
        title: Lower
        type: number
        superTitle: AVE CI
        visible: (bootstrap)
      - name: aveUpper
        title: Upper
        type: number
        superTitle: AVE CI
        visible: (bootstrap)
      - name: assessment
        title: Assessment
        type: text

  - name: htmtGuide
    title: How to read discriminant validity
    type: Html
    visible: (showGuides)

  # One row per pair of reflective constructs (rows laid out in .init()).
  # ES: Una fila por par de constructos reflectivos (filas en .init()).
  - name: htmt
    title: Discriminant validity (HTMT)
    type: Table
    rows: 0
    refs:
      - henseler_2015
      - roemer_2021
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: c1
        title: Construct
        type: text
      - name: sep
        title: ''
        type: text
      - name: c2
        title: Construct
        type: text
      - name: htmt
        title: HTMT
        type: number
      - name: htmtUpper
        title: Upper bound
        type: number
        superTitle: HTMT
        visible: (bootstrap)
      - name: htmt2
        title: HTMT2
        type: number
      - name: assessment
        title: Assessment (HTMT)
        type: text

  # Square table: one row and one column per reflective construct (laid out
  # in .init()).
  # ES: Tabla cuadrada: una fila y una columna por constructo reflectivo.
  - name: fornell
    title: Fornell-Larcker criterion
    type: Table
    rows: 0
    visible: (fornellLarcker)
    refs:
      - fornell_1981
      - henseler_2015
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - fornellLarcker
    columns:
      - name: construct
        title: ''
        type: text

  - name: vifGuide
    title: How to read the collinearity of formative indicators
    type: Html
    visible: (showGuides)

  # One row per indicator of a formative construct (rows laid out in .init()).
  # ES: Una fila por indicador de un constructo formativo.
  - name: vif
    title: Collinearity of formative indicators
    type: Table
    rows: 0
    refs:
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: construct
        title: Construct
        type: text
        combineBelow: true
      - name: indicator
        title: Indicator
        type: text
      - name: vif
        title: VIF
        type: number
      - name: vifLower
        title: Lower
        type: number
        superTitle: VIF CI
        visible: (bootstrap)
      - name: vifUpper
        title: Upper
        type: number
        superTitle: VIF CI
        visible: (bootstrap)
      - name: assessment
        title: Assessment
        type: text

  - name: pathsGuide
    title: How to read the path coefficients
    type: Html
    visible: (showGuides)

  # One row per structural path (rows laid out in .init()).
  # ES: Una fila por ruta estructural (filas en .init()).
  - name: paths
    title: Path coefficients
    type: Table
    rows: 0
    refs:
      - hair_2019
      - dijkstra_2015
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: from
        title: Predictor
        type: text
      - name: arrow
        title: ''
        type: text
      - name: to
        title: Outcome
        type: text
      - name: estimate
        title: Coefficient
        type: number

  # One row per endogenous construct (rows laid out in .init()).
  # ES: Una fila por constructo endógeno (filas en .init()).
      - name: se
        title: SE
        type: number
        visible: (bootstrap)
      - name: t
        title: t
        type: number
        visible: (bootstrap)
      - name: p
        title: p
        type: number
        format: zto,pvalue
        visible: (bootstrap)
      - name: lower
        title: Lower
        type: number
        superTitle: Coefficient CI
        visible: (bootstrap)
      - name: upper
        title: Upper
        type: number
        superTitle: Coefficient CI
        visible: (bootstrap)
  - name: r2
    title: Explained variance
    type: Table
    rows: 0
    refs:
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: construct
        title: Construct
        type: text
      - name: r2
        title: R²
        type: number
      - name: r2Lower
        title: Lower
        type: number
        superTitle: R² CI
        visible: (bootstrap)
      - name: r2Upper
        title: Upper
        type: number
        superTitle: R² CI
        visible: (bootstrap)
      - name: r2adj
        title: Adjusted R²
        type: number

  - name: structuralGuide
    title: How to read effect sizes, collinearity and effects
    type: Html
    visible: (showGuides)

  # One row per structural path (rows laid out in .init()).
  # ES: Una fila por ruta estructural (filas en .init()).
  - name: f2
    title: Effect size (f²)
    type: Table
    rows: 0
    refs:
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
    columns:
      - name: from
        title: Predictor
        type: text
      - name: arrow
        title: ''
        type: text
      - name: to
        title: Outcome
        type: text
      - name: f2
        title: f²
        type: number
      - name: assessment
        title: Assessment
        type: text

  # One row per structural path (rows laid out in .init()).
  # ES: Una fila por ruta estructural (filas en .init()).
  - name: vifStruct
    title: Collinearity of predictors (structural VIF)
    type: Table
    rows: 0
    refs:
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: from
        title: Predictor
        type: text
      - name: arrow
        title: ''
        type: text
      - name: to
        title: Outcome
        type: text
      - name: vif
        title: VIF
        type: number
      - name: vifLower
        title: Lower
        type: number
        superTitle: VIF CI
        visible: (bootstrap)
      - name: vifUpper
        title: Upper
        type: number
        superTitle: VIF CI
        visible: (bootstrap)
      - name: assessment
        title: Assessment
        type: text

  # One row per pair of constructs joined by at least one path, directly or
  # through other constructs (rows laid out in .init()).
  # ES: Una fila por par de constructos unidos por al menos una ruta,
  # directa o a través de otros constructos.
  - name: effects
    title: Direct, indirect and total effects
    type: Table
    rows: 0
    refs:
      - hair_2019
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel
    columns:
      - name: from
        title: Predictor
        type: text
      - name: arrow
        title: ''
        type: text
      - name: to
        title: Outcome
        type: text
      - name: direct
        title: Direct
        type: number
      - name: indirect
        title: Indirect
        type: number
      - name: indLower
        title: Lower
        type: number
        superTitle: Indirect CI
        visible: (bootstrap)
      - name: indUpper
        title: Upper
        type: number
        superTitle: Indirect CI
        visible: (bootstrap)
      - name: total
        title: Total
        type: number
      - name: totLower
        title: Lower
        type: number
        superTitle: Total CI
        visible: (bootstrap)
      - name: totUpper
        title: Upper
        type: number
        superTitle: Total CI
        visible: (bootstrap)

  - name: pathDiagram
    title: Path diagram
    type: Image
    width: 700
    height: 460
    renderFun: .plotPaths
    visible: (pathDiagram)
    clearWith:
      - diagramLayout
      - diagramTitle
      - diagramIndicators
      - diagramCaption
      - latentSize
      - manifestSize
      - nodeLabelSize
      - latentFill
      - manifestFill
      - edgeWidth
      - edgeColor
      - nonsigDashed
      - edgeLabels
      - edgeLabelSize
      - edgeDigits
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel

  # Small cache of bootstrap results (MokkenLab pattern), cleared when the
  # model or the data options change.
  # ES: Caché pequeña de resultados del bootstrap (patrón de MokkenLab).

  - name: loadingsPlot
    title: Loadings of reflective indicators
    type: Image
    width: 600
    height: 400
    renderFun: .plotLoadings
    visible: (loadingsPlot)
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel

  # Small cache of bootstrap results (MokkenLab pattern), cleared when the
  # model or the data options change.
  # ES: Caché pequeña de resultados del bootstrap (patrón de MokkenLab).

  - name: htmtPlot
    title: Discriminant validity (HTMT)
    type: Image
    width: 520
    height: 420
    renderFun: .plotHtmt
    visible: (htmtPlot)
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing
      - bootstrap
      - bootReps
      - bootSeed
      - ciLevel

  # Small cache of bootstrap results (MokkenLab pattern), cleared when the
  # model or the data options change.
  # ES: Caché pequeña de resultados del bootstrap (patrón de MokkenLab).
  - name: cacheStore
    type: Html
    visible: false
    clearWith:
      - reflective
      - formative
      - structural
      - estimator
      - innerScheme
      - indicatorScale
      - missing

  - name: interpretation
    title: Applied interpretation
    type: Html

  - name: reproducibility
    title: Reproducibility
    type: Html
    visible: (showRepro)

  # Html with <pre>, not Preformatted: jamovi's PDF export drops the line
  # breaks of a Preformatted item.
  # ES: Html con <pre>: la exportación a PDF de jamovi pierde los saltos de
  # línea de un Preformatted.
  - name: reproducibilityCode
    title: Equivalent R code
    type: Html
    visible: (showRepro)
...
