          - formativeHoc
          - hocApproach
          - structural
          - estimator
          - innerScheme
          - weightApproach
          - indicatorScale
          - missing
          - bootstrap
          - bootReps
          - resampleMethod
          - bootSeed
          - ciLevel
          - omegaCfa
        columns:
          - name: construct
            title: Construct
            type: text
          - name: alpha
            title: Cronbach's α
            type: number
          - name: rhoA
            title: ρA
            type: number
          - name: rhoC
            title: ρC
            type: number
          - name: rhoCLower
            title: Lower
            type: number
