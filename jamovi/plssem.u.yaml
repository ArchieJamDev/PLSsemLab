# Layout: the two construct boxes take the indicators from the data (as
# EGAnetLab's Theoretical structure and jamovi's CFA); the structural model
# takes constructs from a Supplier that jamovi/js/plssem.events.js fills with
# the names defined above (SEMLj's pattern). Option boxes use Title Case.
# ES: Disposición: las dos cajas de constructos toman los indicadores de los
# datos (como la Estructura teórica de EGAnetLab y el CFA de jamovi); el
# modelo estructural toma constructos de un Supplier que llena
# jamovi/js/plssem.events.js con los nombres definidos arriba (patrón de
# SEMLj). Las cajas de opciones van en Title Case.
title: PLS-SEM
name: plssem
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: './plssem.events::update'
children:
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Reflective Constructs
        children:
          - type: ListBox
            name: reflective
            height: large
            addButton: Add New Construct
            events:
              listItemAdded: './plssem.events::onConstructsChanged'
              listItemRemoved: './plssem.events::onConstructsChanged'
            templateName: linreg-block-template
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  valueKey:
                    - label
                  borderless: true
                  name: reflectiveName
                  stretchFactor: 1
                  margin: normal
                  events:
                    change: './plssem.events::onConstructsChanged'
                - type: VariablesListBox
                  valueFilter: unique
                  valueKey:
                    - vars
                  name: reflectiveVars
                  isTarget: true
                  height: auto
                  ghostText: drag indicators here
                  events:
                    listItemAdded: './plssem.events::onConstructsChanged'
                    listItemRemoved: './plssem.events::onConstructsChanged'
      - type: TargetLayoutBox
        label: Formative Constructs
        children:
          - type: ListBox
            name: formative
            height: normal
            addButton: Add New Construct
            events:
              listItemAdded: './plssem.events::onConstructsChanged'
              listItemRemoved: './plssem.events::onConstructsChanged'
            templateName: linreg-block-template
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  valueKey:
                    - label
                  borderless: true
                  name: formativeName
                  stretchFactor: 1
                  margin: normal
                  events:
                    change: './plssem.events::onConstructsChanged'
                - type: VariablesListBox
                  valueFilter: unique
                  valueKey:
                    - vars
                  name: formativeVars
                  isTarget: true
                  height: auto
                  ghostText: drag indicators here
                  events:
                    listItemAdded: './plssem.events::onConstructsChanged'
                    listItemRemoved: './plssem.events::onConstructsChanged'
  # Higher-order constructs (phase 4): built from the first-order
  # constructs, which a second supplier offers (filled by the JS, as the
  # structural model's).
  # ES: Constructos de orden superior (fase 4): se arman con los constructos
  # de primer orden, que ofrece un segundo supplier (lo llena el JS).
  - type: CollapseBox
    label: Higher-Order Constructs
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: hocApproach
      - type: Supplier
        label: First-order constructs
        name: hocSupplier
        format: term
        persistentItems: true
        stretchFactor: 1
        events:
          update: './plssem.events::onUpdateHocSupplier'
          change: './plssem.events::onChangeConstructSupplier'
        children:
          - type: TargetLayoutBox
            label: Reflective Higher-Order Constructs
            children:
              - type: ListBox
                name: reflectiveHoc
                height: normal
                addButton: Add Higher-Order Construct
                events:
                  listItemAdded: './plssem.events::onConstructsChanged'
                  listItemRemoved: './plssem.events::onConstructsChanged'
                templateName: linreg-block-template
                template:
                  type: LayoutBox
                  margin: normal
                  targetArea: true
                  children:
                    - type: TextBox
                      valueKey:
                        - label
                      borderless: true
                      name: reflectiveHocName
                      stretchFactor: 1
                      margin: normal
                      events:
                        change: './plssem.events::onConstructsChanged'
                    - type: ListBox
                      valueKey:
                        - components
                      name: reflectiveHocComponents
                      isTarget: true
                      valueFilter: unique
                      height: auto
                      ghostText: drag first-order constructs here
                      events:
                        change: './plssem.events::onConstructsChanged'
                      template:
                        type: TermLabel
          - type: TargetLayoutBox
            label: Formative Higher-Order Constructs
            children:
              - type: ListBox
                name: formativeHoc
                height: normal
                addButton: Add Higher-Order Construct
                events:
                  listItemAdded: './plssem.events::onConstructsChanged'
                  listItemRemoved: './plssem.events::onConstructsChanged'
                templateName: linreg-block-template
                template:
                  type: LayoutBox
                  margin: normal
                  targetArea: true
                  children:
                    - type: TextBox
                      valueKey:
                        - label
                      borderless: true
                      name: formativeHocName
                      stretchFactor: 1
                      margin: normal
                      events:
                        change: './plssem.events::onConstructsChanged'
                    - type: ListBox
                      valueKey:
                        - components
                      name: formativeHocComponents
                      isTarget: true
                      valueFilter: unique
                      height: auto
                      ghostText: drag first-order constructs here
                      events:
                        change: './plssem.events::onConstructsChanged'
                      template:
                        type: TermLabel
  - type: CollapseBox
    label: Structural Model
    collapsed: false
    stretchFactor: 1
    children:
      - type: Supplier
        label: Constructs
        name: constructSupplier
        format: term
        persistentItems: true
        stretchFactor: 1
        events:
          update: './plssem.events::onUpdateConstructSupplier'
          change: './plssem.events::onChangeConstructSupplier'
        children:
          - type: TargetLayoutBox
            label: Predictors of each construct
            transferAction: interactions
            children:
              - type: ListBox
                name: structural
                height: large
                selectable: true
                templateName: linreg-block-template
                template:
                  type: LayoutBox
                  margin: normal
                  targetArea: true
                  children:
                    # Row header, as jmv's regression blocks: a Label first
                    # (item.controls[0]) whose text the JS sets to the
                    # construct name.
                    # ES: Encabezado de fila, como los bloques de regresión
                    # de jmv: un Label cuyo texto pone el JS.
                    - type: Label
                      label: ' '
                      name: predictorHeader
                      stretchFactor: 1
                      margin: normal
                    - type: ListBox
                      name: predictorList
                      isTarget: true
                      valueFilter: unique
                      height: auto
                      ghostText: drag predictors here
                      events:
                        change: './plssem.events::onPredictorsChanged'
                      template:
                        type: TermLabel
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: ComboBox
            name: estimator
          - type: ComboBox
            name: innerScheme
          - type: ComboBox
            name: indicatorScale
          - type: ComboBox
            name: missing
  - type: CollapseBox
    label: Bootstrap
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: bootstrap
          - type: TextBox
            name: bootReps
            format: number
            enable: (bootstrap)
          - type: TextBox
            name: bootSeed
            format: number
            enable: (bootstrap)
          - type: TextBox
            name: ciLevel
            format: number
            enable: (bootstrap)
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: pathDiagram
          - type: CheckBox
            name: loadingsPlot
          - type: CheckBox
            name: htmtPlot
          - type: CheckBox
            name: moderationPlot
  - type: CollapseBox
    label: Path Diagram
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Layout
            children:
              - type: ComboBox
                name: diagramLayout
                enable: (pathDiagram)
              - type: TextBox
                name: diagramTitle
                format: string
                enable: (pathDiagram)
              - type: CheckBox
                name: diagramIndicators
                enable: (pathDiagram)
              - type: CheckBox
                name: diagramCaption
                enable: (pathDiagram)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 1
        children:
          - type: Label
            label: Nodes and labels
            children:
              - type: TextBox
                name: latentSize
                format: number
                enable: (pathDiagram)
              - type: TextBox
                name: manifestSize
                format: number
                enable: (pathDiagram && diagramIndicators)
              - type: TextBox
                name: nodeLabelSize
                format: number
                enable: (pathDiagram)
              - type: ComboBox
                name: latentFill
                enable: (pathDiagram)
              - type: ComboBox
                name: manifestFill
                enable: (pathDiagram && diagramIndicators)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 2
        children:
          - type: Label
            label: Arrows
            children:
              - type: ComboBox
                name: edgeWidth
                enable: (pathDiagram)
              - type: ComboBox
                name: edgeColor
                enable: (pathDiagram)
              - type: CheckBox
                name: nonsigDashed
                enable: (pathDiagram && bootstrap)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 3
        children:
          - type: Label
            label: Coefficients
            children:
              - type: CheckBox
                name: edgeLabels
                enable: (pathDiagram)
              - type: TextBox
                name: edgeLabelSize
                format: number
                enable: (pathDiagram && edgeLabels)
              - type: TextBox
                name: edgeDigits
                format: number
                enable: (pathDiagram && edgeLabels)
  - type: CollapseBox
    label: Measurement Model
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: omegaCfa
          - type: CheckBox
            name: fornellLarcker
  - type: CollapseBox
    label: Report Content
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showKeySummary
          - type: CheckBox
            name: showChoicesGuide
          - type: CheckBox
            name: showGuides
          - type: CheckBox
            name: showRepro
