# Opens the PLS-SEM options panel in a real jamovi (official docker image)
# with a headless browser, to diagnose the panel without a desktop jamovi.
# ES: Abre el panel de PLS-SEM en un jamovi real (imagen docker oficial) con
# un navegador sin pantalla, para diagnosticar el panel sin jamovi de
# escritorio.
name: UI probe (jamovi docker)

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'jamovi docker image'
        required: false
        default: 'jamovi/jamovi:28.1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: List jamovi image tags
        run: curl -s "https://hub.docker.com/v2/repositories/jamovi/jamovi/tags?page_size=30" | python3 -c "import json,sys; print([t['name'] for t in json.load(sys.stdin)['results']])" || true

      - name: Start jamovi
        run: |
          docker pull "${{ inputs.image }}"
          docker inspect -f 'CMD={{json .Config.Cmd}} ENTRYPOINT={{json .Config.Entrypoint}} ENV={{json .Config.Env}}' "${{ inputs.image }}"
          docker run -di --name jamovi -p 41337:41337 -p 41338:41338 -p 41339:41339 \
            -e JAMOVI_HOST_A=127.0.0.1:41337 -e JAMOVI_HOST_B=127.0.0.1:41338 -e JAMOVI_HOST_C=127.0.0.1:41339 \
            -e JAMOVI_ACCESS_KEY= -e JAMOVI_ALLOW_ARBITRARY_CODE=false "${{ inputs.image }}" \
            "/usr/bin/python3 -u -m jamovi.server 41337 --if=* --stdin-slave"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:41337/ || true)
            echo "try $i: $code"; [ "$code" = "200" ] && break; sleep 3
          done
          docker logs jamovi 2>&1 | tail -30
          docker exec jamovi sh -c 'ps aux | head -20; ls /root /root/.jamovi 2>/dev/null' || true

      # The same .jmo the user installs (dev-build pre-release, R 4.5.0 for
      # jamovi 2.7), handed to the running jamovi as the compiler does.
      # ES: El mismo .jmo que instala el usuario, entregado al jamovi en
      # marcha como hace el compilador.
      - name: Install the dev-build .jmo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dev-build --pattern '*.jmo' --dir jmo
          docker cp jmo/*.jmo jamovi:/tmp/PLSsemLab.jmo
          docker exec jamovi /bin/sh -c 'echo "install: /tmp/PLSsemLab.jmo" > /proc/1/fd/0'
          sleep 30
          docker logs jamovi 2>&1 | tail -30
          docker exec jamovi sh -c 'find / -maxdepth 6 -type d -name PLSsemLab 2>/dev/null' || true

      - name: Probe the panel with a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p probe-out
          python tests/ui/probe.py probe-out || true
          docker logs jamovi > probe-out/jamovi.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-probe
          path: probe-out
