# Publish an archived version: creates the GitHub release (which Zenodo turns
# into a DOI) with the notes in .github/release-notes/<tag>.md and the
# Windows .jmo of the dev-build-windows pre-release.
# ES: Publica una versión archivada: crea la versión de GitHub (que Zenodo
# convierte en DOI) con las notas de .github/release-notes/<tag>.md y el .jmo
# de Windows de la pre-versión dev-build-windows.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.7.5"
        required: true
      jmo_from:
        description: "Pre-release that holds the Windows .jmo"
        required: false
        default: "dev-build-windows"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VER="${TAG#v}"
          grep -q "version: $VER" jamovi/0000.yaml || { echo "jamovi/0000.yaml is not $VER"; exit 1; }
          gh release download "${{ inputs.jmo_from }}" -p "PLSsemLab_${VER}_win64.jmo"
          gh release create "$TAG" "PLSsemLab_${VER}_win64.jmo" --target "$GITHUB_SHA" \
            --title "PLSsemLab $VER" --notes-file ".github/release-notes/$TAG.md"
      - name: Report the Zenodo DOI
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Zenodo archives the release within minutes; print the version and concept DOIs
          # ES: Zenodo archiva la versión en minutos; muestra el DOI de la versión y el general
          for i in $(seq 1 30); do
            sleep 30
            r=$(curl -s "https://zenodo.org/api/records?q=title:PLSsemLab&sort=mostrecent&size=5")
            hit=$(echo "$r" | jq -r --arg v "$TAG" '.hits.hits[] | select(.metadata.version == $v or .metadata.version == ($v|ltrimstr("v"))) | "version DOI: \(.doi)  concept DOI: \(.conceptdoi)"' | head -1)
            if [ -n "$hit" ]; then echo "$hit"; echo "$hit" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          done
          echo "Zenodo record not found yet"; echo "$r" | jq -r '.hits.hits[] | "\(.metadata.version) \(.doi) \(.conceptdoi)"'
