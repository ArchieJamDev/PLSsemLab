description: >
  PLSsemLab brings partial least squares structural equation modeling (PLS-SEM)
  to jamovi with the cSEM package and pairs every result with evidence-based
  methodological guidance, interpretation and educational support. The model is
  built from boxes, never typed: reflective and formative constructs with their
  indicators, and for each construct the constructs that predict it. The model
  is checked before estimation, with messages that name the construct or
  indicator at fault. In development.
