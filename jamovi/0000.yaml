---
name: PLSsemLab
title: PLS-SEM Lab
version: 1.0.0
jms: '1.0'
authors:
  - Arquímedes De León Chacón Chacón
maintainer: Arquímedes De León Chacón Chacón <arquimedeschacon@gmail.com>
date: '2026-11-17'
type: R
description: >
  PLSsemLab brings partial least squares structural equation modeling (PLS-SEM)
  to jamovi with the cSEM package and pairs every result with evidence-based
  methodological guidance, interpretation and educational support. The model is
  built from boxes, never typed: reflective and formative constructs with their
  indicators, and for each construct the constructs that predict it. The model
  is checked before estimation, with messages that name the construct or
  indicator at fault.
usesNative: false
minApp: 1.0.8
icon: assets/plssemlab-icon.png
analyses:
  - title: PLS-SEM
    name: plssem
    ns: PLSsemLab
    menuGroup: PLS-SEM Lab
    menuTitle: PLS-SEM
    description: >
      Partial least squares structural equation modeling with cSEM: reflective
      and formative constructs and higher-order constructs built from boxes,
      model validation before estimation, PLS and consistent PLS, measurement
      quality (reliability, HTMT, VIF), paths, effect sizes, mediation and
      moderation with bootstrap intervals, the overall fit test, PLSpredict and
      CVPAT, the importance-performance map and multigroup analysis (MICOM and
      path differences), each with plain-language interpretation.
    category: analyses
datasets:
  - name: Corporate reputation (n=344)
    path: plssemlab_corp_rep.csv
    description: >-
      Corporate reputation, satisfaction and loyalty of 344 mobile phone
      customers, the example of the PLS-SEM primer of Hair et al., with missing
      answers as empty cells, from the cSEM package - see data/README.md
  - name: Customer satisfaction index ECSI (n=250)
    path: plssemlab_satisfaction.csv
    description: >-
      European Customer Satisfaction Index for the mobile phone industry: image,
      expectation, quality, value, satisfaction and loyalty, from the cSEM
      package - see data/README.md
  - name: Learning data, simulated (n=600)
    path: plssemlab_learning.csv
    description: >-
      Simulated employees with a known population model, to try every option:
      reflective and formative constructs, a higher-order construct (work
      engagement), a moderation, a mediation, a difference between sectors for
      the multigroup analysis and missing answers; CC0 - see data/README.md
  - name: Bank customers, with demographics (n=675)
    path: plssemlab_bank.csv
    description: >-
      Corporate reputation, trust, satisfaction and loyalty of 675 German bank
      customers (four formative and five reflective constructs) with gender, age
      group, education, employment, income and family status; Damberg (2023), CC
      BY 4.0 - see data/README.md

