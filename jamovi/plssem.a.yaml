---
name: plssem
title: PLS-SEM
menuGroup: PLS-SEM Lab
menuTitle: PLS-SEM
version: '0.0.0'
jas: '1.2'

description:
    main: >
      Partial least squares structural equation modeling: reflective and
      formative constructs built from boxes, model validation before
      estimation, loadings and weights, reliability, convergent and
      discriminant validity, collinearity of formative indicators, paths and
      explained variance, with plain-language interpretation.

options:
  - name: data
    type: Data

  # Reflective constructs: each item of the box is a named construct with the
  # indicators dragged into it. "Reflective" is the measurement model as it
  # is taught (the construct causes its indicators); the estimator option
  # decides how cSEM estimates it (ARCHITECTURE.md §16).
  # ES: Constructos reflectivos: cada ítem de la caja es un constructo con
  # nombre y los indicadores arrastrados a él. "Reflectivo" es el modelo de
  # medida tal como se enseña (el constructo causa sus indicadores); la
  # opción de estimador decide cómo lo estima cSEM (ARCHITECTURE.md §16).
  - name: reflective
    title: Reflective Constructs
    type: Array
    default:
      - label: Construct 1
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - continuous
            - ordinal
          permitted:
            - numeric

  # Formative constructs: the indicators form the construct (Mode B weights).
  # ES: Constructos formativos: los indicadores forman el constructo (pesos
  # de Modo B).
  - name: formative
    title: Formative Constructs
    type: Array
    default: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - continuous
            - ordinal
          permitted:
            - numeric

  # Structural model: one row per construct (Array of Terms, as SEMLj's
  # endogenousTerms), in the order of the constructs that have a name and at
  # least one indicator (reflective first); each row holds the constructs
  # dragged into it, its predictors. A row with no predictors is an exogenous
  # construct. jamovi/js/plssem.events.js keeps the rows in step with the
  # boxes and R reads them with the same rule (.pl_structural_labels).
  # ES: Modelo estructural: una fila por constructo (Array de Terms, como el
  # endogenousTerms de SEMLj), en el orden de los constructos con nombre y al
  # menos un indicador (reflectivos primero); cada fila guarda sus
  # predictores. Una fila sin predictores es un constructo exógeno. El JS
  # mantiene las filas sincronizadas y R las lee con la misma regla.
  # Higher-order constructs (phase 4): a name and two or more first-order
  # constructs, taken as Terms from the construct supplier (not data
  # variables). Reflective: the lower-order constructs reflect it (Mode A in
  # stage 2); formative: they form it (Mode B).
  # ES: Constructos de orden superior (fase 4): un nombre y dos o más
  # constructos de primer orden, como Terms del supplier (no variables de los
  # datos). Reflectivo: Modo A en la etapa 2; formativo: Modo B.
  - name: reflectiveHoc
    title: Reflective Higher-Order Constructs
    type: Array
    default: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: components
          type: Terms

  - name: formativeHoc
    title: Formative Higher-Order Constructs
    type: Array
    default: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: components
          type: Terms

  - name: structural
    title: Structural Model
    type: Array
    default: []
    template:
      type: Terms

  # PLS (composite-based; reflective constructs as Mode A composites) or
  # consistent PLS (reflective constructs as common factors, corrected for
  # measurement error; Dijkstra & Henseler, 2015).
  # ES: PLS (basado en compuestos; reflectivos como compuestos de Modo A) o
  # PLS consistente (reflectivos como factores comunes, corregidos por error
  # de medida; Dijkstra y Henseler, 2015).
  - name: estimator
    title: Estimator
    type: List
    options:
      - title: PLS
        name: pls
      - title: Consistent PLS (PLSc)
        name: plsc
    default: pls

  # Inner weighting scheme of the PLS algorithm (path is cSEM's and SmartPLS'
  # default).
  # ES: Esquema de ponderación interna del algoritmo PLS (path es el valor
  # por defecto de cSEM y SmartPLS).
  - name: innerScheme
    title: Inner weighting scheme
    type: List
    options:
      - title: Path
        name: path
      - title: Centroid
        name: centroid
      - title: Factorial
        name: factorial
    default: path

  # How the indicators are correlated. Continuous: Pearson correlations, as
  # in classic PLS-SEM. Ordinal: polychoric correlations (ordinal PLS;
  # Schuberth, Henseler & Dijkstra, 2018), which cSEM uses when the
  # indicators are ordered factors. It changes the whole model, not only the
  # reliability, so it is an estimation choice; continuous is the default
  # because it is what the PLS-SEM literature reports.
  # ES: Cómo se correlacionan los indicadores. Continuos: correlaciones de
  # Pearson, como en el PLS-SEM clásico. Ordinales: policóricas (PLS
  # ordinal), que cSEM usa cuando los indicadores son factores ordenados.
  # Cambia el modelo completo, no solo la fiabilidad, así que es una
  # elección de estimación; continuos por defecto porque es lo que informa
  # la literatura de PLS-SEM.
  - name: indicatorScale
    title: Indicators
    type: List
    options:
      - title: Continuous (Pearson correlations)
        name: continuous
      - title: Ordinal (polychoric correlations)
        name: ordinal
    default: continuous

  # PLS needs complete data. Listwise deletion is the default because it adds
  # no information; mean replacement is offered because the PLS-SEM primer
  # uses it with few missing values, and the report says what it costs.
  # ES: PLS necesita datos completos. La eliminación por lista es el valor por
  # defecto porque no añade información; el reemplazo por la media se ofrece
  # porque el primer de PLS-SEM lo usa con pocos perdidos, y el informe dice
  # lo que cuesta.
  - name: missing
    title: Missing values
    type: List
    options:
      - title: Exclude cases listwise
        name: listwise
      - title: Replace by the indicator mean
        name: mean
    default: listwise

  # Fornell-Larcker criterion: replaced by HTMT (Henseler et al., 2015), but
  # still requested by reviewers, so it is optional and off by default.
  # ES: Criterio de Fornell-Larcker: reemplazado por el HTMT, pero los
  # revisores aún lo piden, así que es opcional y viene desactivado.
  - name: fornellLarcker
    title: Fornell-Larcker criterion
    type: Bool
    default: false

  # ---------------------------------------------------------------------------
  # Bootstrap (phase 3). Off by default because it takes time (jamovi's
  # review: long computations behind an explicit "Run" box); run in blocks of
  # 200 resamples with a checkpoint between blocks, so it shows progress and
  # stops when an option changes. Block k uses seed + k - 1: up to 200
  # resamples the result is identical to a direct cSEM call with this seed.
  # ES: Bootstrap (fase 3). Desactivado por defecto porque tarda (revisión de
  # jamovi: cálculos largos tras una casilla "Run" explícita); en bloques de
  # 200 réplicas con un checkpoint entre bloques, para mostrar el avance y
  # detenerse si cambia una opción. El bloque k usa semilla + k - 1: hasta
  # 200 réplicas el resultado es idéntico a una llamada directa a cSEM.
  # ---------------------------------------------------------------------------
  - name: bootstrap
    title: Run bootstrap
    type: Bool
    default: false

  - name: bootReps
    title: Resamples
    type: Integer
    min: 100
    max: 100000
    default: 2000

  - name: bootSeed
    title: Seed
    type: Integer
    default: 2026

  - name: ciLevel
    title: Confidence level
    type: Number
    min: 0.5
    max: 0.999
    default: 0.95

  # Path diagram drawn by the module (cSEM's uses DiagrammeR, which jamovi
  # cannot show).
  # ES: Diagrama de rutas dibujado por el módulo (el de cSEM usa
  # DiagrammeR, que jamovi no muestra).
  - name: pathDiagram
    title: Path diagram
    type: Bool
    default: true

  # Measurement-model plots: loadings of reflective indicators against the
  # 0.708 reference (with intervals after the bootstrap), and HTMT per pair.
  # ES: Gráficos del modelo de medida: cargas reflectivas frente a 0.708 (con
  # intervalos tras el bootstrap) y HTMT por par.
  - name: loadingsPlot
    title: Loadings
    type: Bool
    default: false

  - name: htmtPlot
    title: HTMT
    type: Bool
    default: false

  # Simple slopes and floodlight of each interaction (phase 4); drawn only
  # when the model has an interaction.
  # ES: Pendientes simples y floodlight de cada interacción (fase 4).
  - name: moderationPlot
    title: Moderation (simple slopes and floodlight)
    type: Bool
    default: true

  # Path diagram settings (EGAnetLab's Network Plot box): a SEM diagram
  # drawn with semPlot (as SEMLj). Colours default to jamovi's theme; the
  # other choices are fixed colours for printing.
  # ES: Ajustes del diagrama de rutas (como la caja Gráfico de red de
  # EGAnetLab): un diagrama SEM con semPlot (como SEMLj). Los colores siguen
  # por defecto el tema de jamovi.
  - name: diagramLayout
    title: Layout
    type: List
    options:
      - title: Tree, left to right
        name: treeLR
      - title: Tree, top to bottom
        name: treeTB
      - title: Circle
        name: circle
      - title: Spring
        name: spring
    default: treeLR

  - name: diagramTitle
    title: Plot title
    type: String
    default: ''

  - name: diagramIndicators
    title: Show indicators
    type: Bool
    default: true

  - name: diagramCaption
    title: Caption
    type: Bool
    default: true

  - name: latentSize
    title: Construct size
    type: Number
    min: 3
    max: 30
    default: 11

  - name: manifestSize
    title: Indicator size
    type: Number
    min: 2
    max: 20
    default: 6

  - name: nodeLabelSize
    title: Label size
    type: Number
    min: 0.3
    max: 3
    default: 1

  - name: latentFill
    title: Construct fill
    type: List
    options:
      - title: jamovi theme
        name: theme
      - title: White
        name: white
      - title: Light blue
        name: lightblue
      - title: Light gray
        name: grey90
      - title: Light yellow
        name: lightyellow
    default: theme

  - name: manifestFill
    title: Indicator fill
    type: List
    options:
      - title: jamovi theme
        name: theme
      - title: White
        name: white
      - title: Light blue
        name: lightblue
      - title: Light gray
        name: grey90
      - title: Light yellow
        name: lightyellow
    default: theme

  - name: edgeWidth
    title: Arrow width
    type: List
    options:
      - title: Follows the coefficient
        name: estimate
      - title: Uniform
        name: uniform
    default: estimate

  - name: edgeColor
    title: Arrow color
    type: List
    options:
      - title: jamovi theme
        name: theme
      - title: Black
        name: black
      - title: Dark gray
        name: grey30
      - title: Navy
        name: navy
    default: theme

  - name: nonsigDashed
    title: Non-significant paths dashed
    type: Bool
    default: true

  - name: edgeLabels
    title: Coefficients on the arrows
    type: Bool
    default: true

  - name: edgeLabelSize
    title: Coefficient size
    type: Number
    min: 0.3
    max: 3
    default: 0.8

  - name: edgeDigits
    title: Decimals
    type: Integer
    min: 0
    max: 4
    default: 2

  # McDonald's omega from a one-factor CFA of each reflective construct
  # (lavaan, the engine of jamovi's own CFA), estimated outside the PLS
  # model as an independent reference for rho_C. Off by default.
  # ES: Omega de McDonald de un AFC de un factor por constructo reflectivo
  # (lavaan, el motor del AFC de jamovi), estimada fuera del modelo PLS como
  # referencia independiente para rho_C. Desactivada por defecto.
  - name: omegaCfa
    title: McDonald's ω (one-factor CFA)
    type: Bool
    default: false

  # ---------------------------------------------------------------------------
  # Report content.
  # ES: Contenido del informe.
  # ---------------------------------------------------------------------------

  # Key findings summary at the top of the report.
  # ES: Resumen de hallazgos clave al inicio del informe.
  - name: showKeySummary
    title: Key findings
    type: Bool
    default: true

  # Explains every choice currently selected and when another fits better.
  # ES: Explica cada elección seleccionada y cuándo conviene otra.
  - name: showChoicesGuide
    title: About your choices
    type: Bool
    default: true

  # "How to read" block before each table (off by default, as MokkenLab
  # after jamovi's review, so the output stays compact).
  # ES: Bloque "Cómo leer" antes de cada tabla (desactivado por defecto,
  # como MokkenLab tras la revisión de jamovi, para una salida compacta).
  - name: showGuides
    title: How to read each table
    type: Bool
    default: false

  # Versions and the equivalent R code of this run.
  # ES: Versiones y el código R equivalente de esta ejecución.
  - name: showRepro
    title: Reproducibility record
    type: Bool
    default: true
...
